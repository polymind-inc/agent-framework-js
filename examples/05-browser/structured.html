<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Framework — structured output example</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <nav>
          <a href="/">Chat</a>
          <a href="/canvas.html">Canvas</a>
          <a href="/structured.html" aria-current="page">Structured output</a>
          <a href="/anthropic.html">Anthropic</a>
        </nav>
        <h1>Typed extraction into the page</h1>
        <p class="warning">
          The schema-validated <code>response.value</code> fills the fields below directly — no
          JSON.parse in sight. Keys pasted here stay in memory — in production, run agents server-side.
        </p>
        <div class="settings">
          <label>
            API key
            <input id="api-key" type="password" placeholder="sk-..." autocomplete="off" />
          </label>
          <label>
            Base URL
            <input id="base-url" type="text" placeholder="https://proxy.example.com/v1 (optional)" />
          </label>
          <label>
            Model
            <input id="model" type="text" value="gpt-4o-mini" />
          </label>
        </div>
      </header>
      <form id="composer">
        <textarea id="source" rows="5">
Hi both! Quarterly planning is confirmed for March 12 at the Sapporo office, 10am sharp.
Naomi and Kenji are in; I still need an answer from Aoi. — Mika</textarea>
        <button id="extract" type="submit">Extract event</button>
      </form>
      <section id="result" aria-live="polite"></section>
      <section id="log" aria-live="polite"></section>
    </main>
    <script type="module" src="/src/structured.ts"></script>
  </body>
</html>
