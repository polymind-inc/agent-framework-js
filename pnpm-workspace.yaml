packages:
  - 'packages/*'
  - 'examples/*'
  - 'scripts/type-resolution'
minimumReleaseAge: 1440
overrides:
  'nanoid@>=3.0.0 <3.3.18': 3.3.18
catalog:
  '@types/node': ^24.13.5
  '@vitest/coverage-v8': 5.0.1
  openai: ^7.18.0
  tsdown: ^0.23.0
  tsx: ^4.23.13
  typescript: ^7.0.2
  vitest: ^5.0.1
allowBuilds:
  esbuild: true
  # The optional OTLP/gRPC exporters pull protobufjs in; its postinstall only prints a banner
  # and the library works without it, so it stays unapproved.
  protobufjs: false
