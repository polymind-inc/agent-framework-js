packages:
  - 'packages/*'
  - 'examples/*'
  - 'scripts/type-resolution'
minimumReleaseAge: 1440
catalog:
  '@types/node': ^24.0.0
  '@vitest/coverage-v8': 4.1.10
  openai: ^7.4.0
  tsdown: ^0.22.14
  tsx: ^4.23.5
  typescript: ^7.0.2
  vitest: ^4.1.10
allowBuilds:
  esbuild: true
  # The optional OTLP/gRPC exporters pull protobufjs in; its postinstall only prints a banner
  # and the library works without it, so it stays unapproved.
  protobufjs: false
