name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix because the format gate depends on LF line endings
        # (see .gitattributes) and would otherwise only be verified on POSIX checkouts.
        os: [ubuntu-latest, windows-latest]

    steps:
      # Actions are pinned to a commit SHA; the trailing comment is the tag that SHA was cut from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # v6 is the first release that supports pnpm 11, which `packageManager` pins us to.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # setup-node caches automatically only for npm, so pnpm needs `cache` set explicitly.
      # It also has to run after pnpm is on PATH for the cache lookup to work.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Build first: packages and examples typecheck against the emitted declarations of their
      # workspace dependencies, so `typecheck` needs `dist` to exist.
      - run: pnpm build

      - run: pnpm typecheck

      - name: Test with coverage gate
        if: runner.os == 'Linux'
        run: pnpm test:coverage

      - name: Test
        if: runner.os != 'Linux'
        run: pnpm test

      # Catches manifest mistakes that would otherwise only surface after publishing: an
      # `exports` entry pointing at a file the tarball does not carry, a missing LICENSE or
      # README, or a workspace: range that cannot be resolved to a published version.
      - run: pnpm run pack:check

      - name: Audit dependencies
        if: runner.os == 'Linux'
        run: pnpm audit --audit-level high

  integration:
    name: live protocol smoke tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: integration
    env:
      RUN_INTEGRATION_TESTS: '1'
      MCP_SERVER_URL: https://learn.microsoft.com/api/mcp
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run live integration suites
        run: >-
          pnpm exec vitest run
          packages/openai/src/integration.test.ts
          packages/anthropic/src/integration.test.ts
          packages/mcp/src/integration.test.ts
          packages/foundry/src/integration.test.ts
