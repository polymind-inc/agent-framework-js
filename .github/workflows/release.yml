name: Release

# A pushed v* tag is the trigger, and the only one. Publishing a GitHub Release creates its tag
# too, so cutting a Release goes through this same path — adding a `release` trigger alongside
# this one would fire two publishes for one release, the second failing as already published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read
      # Required both for npm trusted publishing (OIDC) and for signed provenance.
      id-token: write

    steps:
      # Checks out the commit the tag points at.
      # Actions are pinned to a commit SHA; the trailing comment is the tag that SHA was cut from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # v6 is the first release that supports pnpm 11, which `packageManager` pins us to.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # setup-node caches automatically only for npm, so pnpm needs `cache` set explicitly.
      # It also has to run after pnpm is on PATH for the cache lookup to work.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # All packages ship in lockstep, so one version check covers the set. GITHUB_REF_NAME is a
      # real environment variable, so the tag never gets interpolated into the script text.
      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - run: pnpm lint

      # Build first: typecheck resolves workspace dependencies through their emitted declarations.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm run pack:check

      # A prerelease version must not land on the `latest` dist-tag: npm applies `latest` unless
      # told otherwise, so anyone installing the package would get the prerelease.
      - name: Choose the dist-tag
        id: dist_tag
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          case "$version" in
            *-*) echo "tag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      # Publishes with trusted publishing when the npm packages have this workflow configured as
      # a trusted publisher; falls back to NPM_TOKEN otherwise, which is what the very first
      # publish of a package has to use — a trusted publisher cannot be configured before the
      # package exists.
      #
      # `--provenance` requires the GitHub repository to be PUBLIC. npm rejects provenance from a
      # private or internal repository, so make the repository public before the first release
      # (or drop the flag from `publish:packages` in package.json).
      - name: Publish
        # No `--` before the flag: pnpm forwards trailing args to the script as-is, and a literal
        # `--` would be forwarded too and reach `pnpm publish` as a stray argument.
        run: pnpm run publish:packages --tag ${{ steps.dist_tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
