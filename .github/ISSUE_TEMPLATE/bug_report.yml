name: Bug report
description: Something behaves differently from what the API documents or from the reference implementations.
labels: [bug]

body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest snippet that shows the problem. Include the error and stack trace if there is one.
      render: ts
    validations:
      required: true

  - type: input
    id: packages
    attributes:
      label: Packages and versions
      placeholder: '@polymind-inc/agent-framework-core 0.1.0, @polymind-inc/agent-framework-openai 0.1.0'
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 'node -v'
    validations:
      required: true

  - type: textarea
    id: parity
    attributes:
      label: Reference behaviour
      description: >
        Optional but very helpful. If the .NET, Python or Go implementation of the Agent Framework
        behaves differently here, say which one and how — parity bugs are the highest priority.
