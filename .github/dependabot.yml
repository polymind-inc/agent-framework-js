version: 2

updates:
  # Actions are pinned to commit SHAs, so every upstream release needs a bump to reach us.
  # Dependabot rewrites both the SHA and the `# vX.Y.Z` comment next to it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    commit-message:
      prefix: 'deps'
