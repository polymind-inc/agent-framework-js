version: 2

updates:
  # Actions are pinned to commit SHAs, so every upstream release needs a bump to reach us.
  # Dependabot rewrites both the SHA and the `# vX.Y.Z` comment next to it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # @types/node tracks the minimum supported Node.js runtime, not the newest
      # release, so its major version is only raised together with the runtime
      # requirement — never through an automated bump.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    commit-message:
      prefix: 'deps'
